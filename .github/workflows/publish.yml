name: publish

# Publishes the all-in-one image to GHCR so a deployer never has to build anything:
#   docker run -d -p 8096:8096 -v dmarc-data:/app/data ghcr.io/kristofer84/dmarc-parser:latest
#
# linux/arm64 is built as well as amd64 - this project runs on a Raspberry Pi, and an
# amd64-only image would be useless on the hardware it was written for.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # Provenance: a signed statement binding the image digest to this repo, commit and run,
  # checkable by anyone with `gh attestation verify`. Same reasoning as
  # archer-mr600-openwrt: the artifact people pull should be verifiable, not just trusted.
  id-token: write
  attestations: write

jobs:
  # Reuses ci.yml rather than duplicating it: an image cannot be published from a commit
  # whose tests and type checks have not passed.
  test:
    uses: ./.github/workflows/ci.yml

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Cross-building arm64 on an amd64 runner. Slower than native, but it is a few
      # minutes for this project and it keeps publishing off the Pi.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            # `latest` means "current main", which is what the quickstart pulls.
            type=raw,value=latest,enable={{is_default_branch}}

      # SBOM: the bill of materials is attested and pushed with the image, so an operator
      # asking "what is in this, and is any of it known-bad" can answer it from the artifact
      # rather than from a repository listing a commit nobody pulled.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Shorthand for --attest=type=sbom; it rides along with the pushed image.
          sbom: true

      - name: Attest provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
