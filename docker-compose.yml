services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      # Loopback only: host nginx (dmarc.xcds.net) is the single public entry point.
      - "127.0.0.1:8096:8096"
    environment:
      - NODE_ENV=production
      - PORT=8096
      - DATABASE_URL=file:/app/data/data.db
      - IMAP_HOST=${IMAP_HOST}
      - IMAP_PORT=${IMAP_PORT}
      - IMAP_USER=${IMAP_USER}
      - IMAP_PASSWORD=${IMAP_PASSWORD}
      # First administrator, seeded once when the users table is empty.
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      # TLS terminates at host nginx, so the session cookie must be marked Secure there.
      - COOKIE_SECURE=${COOKIE_SECURE}
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN}
      # Optional "Apply to DNS" credentials. The settings page works too; a value here wins
      # over the same field stored in the database.
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      - LOOPIA_API_USER=${LOOPIA_API_USER:-}
      - LOOPIA_API_PASS=${LOOPIA_API_PASS:-}
      # Optional scheduler overrides.
      - ENABLE_SCHEDULED_EMAIL_PROCESSING=${ENABLE_SCHEDULED_EMAIL_PROCESSING:-}
      - EMAIL_PROCESSING_INTERVAL_MS=${EMAIL_PROCESSING_INTERVAL_MS:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      # Loopback only - the frontend proxies /api to the backend over the compose network.
      - "127.0.0.1:8097:80"
    depends_on:
      - backend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data:
